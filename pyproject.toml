[build-system]
requires = ["setuptools>=69,<82", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-scope-recall"
dynamic = ["version"]
description = "Bounded local memory core with Hermes and Codex adapters, SQLite truth, and rebuildable vector companions."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "scope-recall contributors" }
]
keywords = ["hermes", "codex", "mcp", "memory", "sqlite", "lancedb", "vector"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.22,<5",
  "packaging>=24,<27",
  "tzdata>=2025.3,<2027; sys_platform == 'win32'",
]

[project.scripts]
hermes-scope-recall = "scope_recall.maintenance.cli:main"
scope-recall = "scope_recall.maintenance.cli:main"

[project.entry-points."hermes_agent.memory_providers"]
scope-recall = "scope_recall.distribution.hermes:register"

[project.optional-dependencies]
lancedb = [
  "lancedb>=0.30.2,<=0.37.1",
  "pyarrow>=24,<25",
]
codex = [
  "mcp>=2.0.0,<=2.1.0",
  "pydantic>=2,<3",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "PyYAML>=6,<7",
  "ruff>=0.12,<1",
  "setuptools>=69,<82",
  "wheel>=0.45,<1",
  "pyright>=1.1,<2",
]

[project.urls]
Homepage = "https://github.com/410979729/scope-recall-hermes"
Documentation = "https://github.com/410979729/scope-recall-hermes#readme"
Issues = "https://github.com/410979729/scope-recall-hermes/issues"

[tool.setuptools.dynamic]
version = { attr = "scope_recall._version.__version__" }

[tool.setuptools]
include-package-data = true
packages = [
  "scope_recall",
  "scope_recall._internal",
  "scope_recall._internal.recall",
  "scope_recall.adapters",
  "scope_recall.adapters.codex",
  "scope_recall.adapters.hermes",
  "scope_recall.core",
  "scope_recall.distribution",
  "scope_recall.distribution.hermes",
  "scope_recall.maintenance",
  "scope_recall.runtime",
]
package-dir = { "scope_recall" = "." }

[tool.setuptools.cmdclass]
build_py = "packaging_hooks.v11_build.AllowlistedBuildPy"

[tool.setuptools.package-data]
"scope_recall" = [
  "_lance_worker.py",
  "maintenance/migration_mapping.json",
  "adapters/hermes/plugin.yaml",
  "contracts/*.schema.json",
  "distribution/codex/scope-recall/.codex-plugin/plugin.json",
  "distribution/codex/scope-recall/.mcp.json",
  "distribution/hermes/__init__.py",
  "distribution/hermes/plugin.yaml",
]

[tool.ruff]
extend-exclude = [".hermes-agent-src"]

[tool.ruff.lint]
# Preserve Ruff <=0.15's explicit default contract across the 0.16 default-rule expansion.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
include = [
  "*.py",
  "adapters/**/*.py",
  "core/**/*.py",
  "distribution/**/*.py",
  "maintenance/**/*.py",
  "runtime/**/*.py",
  "packaging_hooks/*.py",
  "scripts/*.py",
]
exclude = [
  ".git",
  ".hermes",
  ".hermes-agent-src",
  ".pytest_cache",
  ".ruff_cache",
  "build",
  "dist",
  "tests",
]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "error"
reportMissingTypeStubs = "none"

[[tool.pyright.executionEnvironments]]
root = "scripts"
reportMissingImports = "warning"
