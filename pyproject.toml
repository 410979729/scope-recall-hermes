[build-system]
# PEP 639 (`license = "MIT"`, `license-files`) is implemented from 77.0.0;
# an older setuptools errors on this file rather than warning.
requires = ["setuptools>=77,<82", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-scope-recall"
dynamic = ["version"]
description = "Bounded local memory core with Hermes and Codex adapters, SQLite truth, and rebuildable vector companions."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "scope-recall contributors" }
]
keywords = ["hermes", "codex", "mcp", "memory", "sqlite", "lancedb", "vector"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.22,<5",
  "packaging>=24,<27",
  "tzdata>=2025.3,<2027; sys_platform == 'win32'",
]

[project.scripts]
hermes-scope-recall = "scope_recall.maintenance.cli:main"
scope-recall = "scope_recall.maintenance.cli:main"

[project.entry-points."hermes_agent.memory_providers"]
scope-recall = "scope_recall.distribution.hermes:register"

[project.optional-dependencies]
lancedb = [
  "lancedb>=0.30.2,<=0.37.1",
  "pyarrow>=24,<25",
]
codex = [
  "mcp>=2.0.0,<=2.1.0",
  "pydantic>=2,<3",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "PyYAML>=6,<7",
  "setuptools>=69,<82",
  "wheel>=0.45,<1",
  # scripts/quality.py compares their findings with a recorded baseline, which another version would not match.
  "ruff==0.16.10",
  "pyright==1.1.414",
]

[project.urls]
Homepage = "https://github.com/410979729/scope-recall-hermes"
Documentation = "https://github.com/410979729/scope-recall-hermes#readme"
Issues = "https://github.com/410979729/scope-recall-hermes/issues"
Source = "https://github.com/410979729/scope-recall-hermes"
Changelog = "https://github.com/410979729/scope-recall-hermes/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "scope_recall._version.__version__" }

[tool.setuptools]
include-package-data = true
packages = [
  "scope_recall",
  "scope_recall.adapters",
  "scope_recall.adapters.clients",
  "scope_recall.adapters.codex",
  "scope_recall.adapters.hermes",
  "scope_recall.core",
  "scope_recall.distribution",
  "scope_recall.distribution.hermes",
  "scope_recall.maintenance",
  "scope_recall.runtime",
  "scope_recall.vector",
]
package-dir = { "scope_recall" = "." }

[tool.setuptools.cmdclass]
build_py = "packaging_hooks.v11_build.AllowlistedBuildPy"

[tool.setuptools.package-data]
"scope_recall" = [
  "_lance_worker.py",
  "maintenance/migration_mapping.json",
  "adapters/hermes/plugin.yaml",
  "contracts/*.schema.json",
  "distribution/codex/scope-recall/.codex-plugin/plugin.json",
  "distribution/codex/scope-recall/.mcp.json",
  "distribution/hermes/__init__.py",
  "distribution/hermes/plugin.yaml",
  "distribution/dsh/scope-recall/index.mjs",
]

[tool.ruff]
line-length = 120
# probes/ is one-statement-per-semicolon operator scratch and does not ship.
extend-exclude = [".hermes-agent-src", "probes"]

[tool.ruff.lint]
# `python scripts/quality.py` holds the tree to the findings recorded in
# scripts/quality.baseline.json: a change may not add one.  `ruff check .`
# alone lists the recorded ones as well.
select = [
  "E", "W", "F",  # pycodestyle, pyflakes
  "I",            # import order
  "B",            # likely bugs
  "UP",           # an older form of what Python 3.11 writes more simply
  "BLE001",       # catching every exception
  "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915",  # function size
]

[tool.ruff.lint.per-file-ignores]
# pytest's fixture-import pattern: an imported fixture reads as unused, then as redefined.
"tests/**" = ["F401", "F811"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 15
max-returns = 8
max-statements = 60

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
include = [
  "*.py",
  "adapters/**/*.py",
  "core/**/*.py",
  "distribution/**/*.py",
  "maintenance/**/*.py",
  "runtime/**/*.py",
  "vector/**/*.py",
  "packaging_hooks/*.py",
  "scripts/*.py",
]
exclude = [
  ".git",
  ".hermes",
  ".hermes-agent-src",
  ".pytest_cache",
  ".ruff_cache",
  "build",
  "dist",
  "tests",
]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "error"
reportMissingTypeStubs = "none"

[[tool.pyright.executionEnvironments]]
root = "scripts"
reportMissingImports = "warning"
