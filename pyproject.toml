[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-scope-recall"
version = "1.10.1"
description = "Hermes scoped memory provider with journal-first capture, SQLite truth, vector companions, and hybrid RRF retrieval."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "scope-recall contributors" }
]
keywords = ["hermes", "memory", "sqlite", "lancedb", "plugin", "vector"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["PyYAML>=6.0", "jsonschema>=4.22"]

[project.scripts]
hermes-scope-recall = "scope_recall.cli:main"

[project.optional-dependencies]
lancedb = [
  "lancedb>=0.30.2",
  "pyarrow>=24,<25",
]
pgvector = [
  "psycopg[binary]>=3",
  "pgvector>=0.3",
]
all = [
  "lancedb>=0.30.2",
  "pyarrow>=24,<25",
  "psycopg[binary]>=3",
  "pgvector>=0.3",
]
dev = [
  "build",
  "pytest",
  "PyYAML>=6",
  "ruff",
  "setuptools>=69",
  "wheel",
  "pyright",
]

[project.urls]
Homepage = "https://github.com/410979729/scope-recall-hermes"
Documentation = "https://github.com/410979729/scope-recall-hermes#readme"
Issues = "https://github.com/410979729/scope-recall-hermes/issues"

[tool.setuptools]
include-package-data = true
packages = [
  "scope_recall",
  "scope_recall._internal",
  "scope_recall._internal.runtime",
  "scope_recall._internal.contracts",
  "scope_recall._internal.journal",
  "scope_recall._internal.experience",
  "scope_recall._internal.nightly",
  "scope_recall._internal.memory",
  "scope_recall._internal.recall",
]
package-dir = {"scope_recall" = "."}

[tool.setuptools.package-data]
"scope_recall" = [
  "py.typed",
  "pyproject.toml",
  "plugin.yaml",
  "config.json",
  "README.md",
  "DESIGN.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "SECURITY.md",
  "MANIFEST.in",
  ".env.example",
  "docs/*.md",
  "docs/benchmarks/*.md",
  "scripts/*.py",
  "scripts/*.json",
  "benchmarks/*.json",
  "examples/external_bridge/*.jsonl",
  "examples/external_bridge/*.sql",
]

[tool.ruff]
extend-exclude = [".hermes-agent-src"]

[tool.ruff.lint]
# Preserve Ruff <=0.15's explicit default contract across the 0.16 default-rule expansion.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]

