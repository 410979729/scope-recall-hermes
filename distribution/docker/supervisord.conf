[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/data/.runtime/supervisord.pid
childlogdir=/data/.runtime

[program:worker-wake]
command=/bin/sh /usr/local/bin/scope-recall-wake-worker
autostart=true
autorestart=true
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
