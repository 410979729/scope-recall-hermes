name: Publish GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v<package-version> tag to publish"
        required: true
        type: string

permissions:
  contents: read

env:
  # Hermes Agent v0.19.1 / v2026.7.30. Compatibility upgrades are reviewed explicitly.
  HERMES_AGENT_COMMIT: cc4cab2f592e60a197e796506de9168f74baf3ea

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release_tag.outputs.release_tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Resolve release tag
        id: release_tag
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${INPUT_RELEASE_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "release_tag=${tag}" >> "${GITHUB_OUTPUT}"
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.release_tag }}
        run: |
          if ! [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: expected v<major>.<minor>.<patch>" >&2
            exit 1
          fi
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.release_tag }}
        run: |
          expected="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${RELEASE_TAG}" = "${expected}"
          test "$(git tag --points-at HEAD | grep -Fx "${RELEASE_TAG}")" = "${RELEASE_TAG}"
      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip build ".[lancedb,dev]"
          python .github/scripts/checkout_pinned_hermes.py
          python -m pip install -e .hermes-agent-src
      - name: Run tagged release gate
        env:
          PYTHONPATH: .hermes-agent-src
        run: python scripts/check.release.py --tagged-release
      - name: Build distributions and release notes
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.release_tag }}
        run: |
          python -m build
          python .github/scripts/extract_changelog_release_notes.py \
            --version "${RELEASE_TAG#v}" \
            --changelog CHANGELOG.md \
            --output release-notes.md
          python - <<'PY'
          import hashlib
          from pathlib import Path

          lines = []
          for artifact in sorted(Path("dist").iterdir()):
              digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
              lines.append(f"{digest}  {artifact.name}")
          Path("SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Upload release distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scope-recall-release
          path: |
            dist/*
            release-notes.md
            SHA256SUMS
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download reviewed release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scope-recall-release
          path: release-assets
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "scope-recall ${RELEASE_TAG}" \
              --notes-file release-assets/release-notes.md
            gh release upload "${RELEASE_TAG}" \
              release-assets/dist/* \
              release-assets/SHA256SUMS \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              release-assets/dist/* \
              release-assets/SHA256SUMS \
              --title "scope-recall ${RELEASE_TAG}" \
              --notes-file release-assets/release-notes.md \
              --verify-tag
          fi
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release-assets/dist/
          print-hash: true
