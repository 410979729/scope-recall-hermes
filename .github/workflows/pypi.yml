name: Publish to PyPI
run-name: >-
  PyPI publish ${{ github.event.release.tag_name ||
  github.event.client_payload.tag || inputs.release_tag }}

on:
  release:
    types: [published]
  repository_dispatch:
    types: [scope-recall-pypi-publish]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v<package-version> tag to publish"
        required: true
        type: string

permissions:
  contents: read

env:
  # Hermes Agent v0.19.1 / v2026.7.30. Compatibility upgrades are reviewed explicitly.
  HERMES_AGENT_COMMIT: cc4cab2f592e60a197e796506de9168f74baf3ea

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: >-
            ${{ github.event.release.tag_name ||
            github.event.client_payload.tag || inputs.release_tag }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Validate release tag
        env:
          RELEASE_TAG: >-
            ${{ github.event.release.tag_name ||
            github.event.client_payload.tag || inputs.release_tag }}
        run: |
          if ! [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: expected a v<major>.<minor>.<patch> tag ref" >&2
            exit 1
          fi
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: >-
            ${{ github.event.release.tag_name ||
            github.event.client_payload.tag || inputs.release_tag }}
        run: |
          expected="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${RELEASE_TAG}" = "${expected}"
          test "$(git tag --points-at HEAD | grep -Fx "${expected}")" = "${expected}"
      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip build ".[lancedb,dev]"
          python .github/scripts/checkout_pinned_hermes.py
          python -m pip install -e .hermes-agent-src
      - name: Run tagged release gate
        env:
          PYTHONPATH: .hermes-agent-src
        run: python scripts/check.release.py --tagged-release
      - name: Build distributions and checksums
        run: |
          python -m build
          python - <<'PY'
          import hashlib
          from pathlib import Path

          lines = []
          for artifact in sorted(Path("dist").iterdir()):
              digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
              lines.append(f"{digest}  {artifact.name}")
          Path("SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Upload reviewed release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scope-recall-pypi
          path: |
            dist/*
            SHA256SUMS
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download reviewed release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scope-recall-pypi
          path: release-assets
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release-assets/dist/
          print-hash: true
