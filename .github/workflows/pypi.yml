name: Publish to PyPI
run-name: >-
  PyPI publish ${{ github.event.client_payload.tag || inputs.release_tag }}

on:
  repository_dispatch:
    types: [scope-recall-pypi-publish]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v<package-version> tag to publish"
        required: true
        type: string

concurrency:
  group: pypi-publish-${{ github.event.client_payload.tag || inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Hermes Agent v0.19.1 / v2026.7.30. Compatibility upgrades are reviewed explicitly.
  HERMES_AGENT_COMMIT: cc4cab2f592e60a197e796506de9168f74baf3ea
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PIP_CONSTRAINT: constraints/release.txt

jobs:
  verify_release_origin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.release_origin.outputs.source_sha }}
      release_run_id: ${{ steps.release_origin.outputs.release_run_id }}
      workflow_run_status: ${{ steps.release_origin.outputs.workflow_run_status }}
      workflow_run_conclusion: ${{ steps.release_origin.outputs.workflow_run_conclusion }}
    steps:
      - name: Verify originating release workflow run
        id: release_origin
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          DISPATCH_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          DISPATCH_RUN_ID: ${{ github.event.client_payload.release_run_id }}
        run: |
          RELEASE_TAG="${DISPATCH_TAG:-${INPUT_RELEASE_TAG}}"
          if ! [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: expected a v<major>.<minor>.<patch> tag ref" >&2
            exit 1
          fi
          mkdir -p release-origin
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern RELEASE-PROVENANCE.json \
            --dir release-origin
          SOURCE_SHA="$(jq -er '.source_sha' release-origin/RELEASE-PROVENANCE.json)"
          RELEASE_RUN_ID="$(jq -er '.workflow.run_id' release-origin/RELEASE-PROVENANCE.json)"
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${RELEASE_RUN_ID}" =~ ^[0-9]+$ ]]
          if [ "${GITHUB_EVENT_NAME}" = "repository_dispatch" ]; then
            test "${DISPATCH_SOURCE_SHA}" = "${SOURCE_SHA}"
            test "${DISPATCH_RUN_ID}" = "${RELEASE_RUN_ID}"
          fi
          RELEASE_RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}")"
          test "$(jq -er '.path' <<<"${RELEASE_RUN_JSON}")" = ".github/workflows/release.yml"
          test "$(jq -er '.head_sha' <<<"${RELEASE_RUN_JSON}")" = "${SOURCE_SHA}"
          test "$(jq -er '.repository.full_name' <<<"${RELEASE_RUN_JSON}")" = "${GITHUB_REPOSITORY}"
          WORKFLOW_RUN_STATUS="$(jq -er '.status' <<<"${RELEASE_RUN_JSON}")"
          WORKFLOW_RUN_CONCLUSION="$(jq -er '.conclusion' <<<"${RELEASE_RUN_JSON}")"
          test "${WORKFLOW_RUN_STATUS}" = "completed"
          test "${WORKFLOW_RUN_CONCLUSION}" = "success"
          {
            echo "source_sha=${SOURCE_SHA}"
            echo "release_run_id=${RELEASE_RUN_ID}"
            echo "workflow_run_status=${WORKFLOW_RUN_STATUS}"
            echo "workflow_run_conclusion=${WORKFLOW_RUN_CONCLUSION}"
          } >> "${GITHUB_OUTPUT}"

  prepare:
    needs: verify_release_origin
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release_tag.outputs.release_tag }}
    steps:
      - name: Resolve release tag
        id: release_tag
        env:
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${DISPATCH_TAG:-${INPUT_RELEASE_TAG}}"
          echo "release_tag=${tag}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ steps.release_tag.outputs.release_tag }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.release_tag }}
        run: |
          if ! [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: expected a v<major>.<minor>.<patch> tag ref" >&2
            exit 1
          fi
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.release_tag }}
        run: |
          expected="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${RELEASE_TAG}" = "${expected}"
          test "$(git tag --points-at HEAD | grep -Fx "${expected}")" = "${expected}"
      - name: Verify checked-out tag matches release source
        env:
          VERIFIED_SOURCE_SHA: ${{ needs.verify_release_origin.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "${VERIFIED_SOURCE_SHA}"
      - name: Install release dependencies
        run: |
          python -m pip install --require-hashes -r constraints/release-hashed.txt
          python -m pip install --no-deps ".[lancedb,dev]"
          python .github/scripts/checkout_pinned_hermes.py
          python -m pip install --no-deps -e .hermes-agent-src
      - name: Run tagged release gate
        env:
          PYTHONPATH: .hermes-agent-src
        run: python scripts/check.release.py --tagged-release
      - name: Download GitHub Release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.release_tag }}
        run: |
          mkdir -p release-download
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir release-download
      - name: Verify GitHub Release artifact SHA-256
        run: |
          python - <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          root = Path("release-download")
          sums_path = root / "SHA256SUMS"
          if not sums_path.is_file():
              raise SystemExit("GitHub Release is missing SHA256SUMS")
          expected: dict[str, str] = {}
          for line in sums_path.read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              digest, name = line.split()
              expected[Path(name).name] = digest
          artifacts = [
              path
              for path in sorted(root.iterdir())
              if path.is_file()
              and path.name not in {"SHA256SUMS", "RELEASE-PROVENANCE.json"}
          ]
          if not artifacts:
              raise SystemExit("GitHub Release contained no wheel/sdist artifacts")
          wheels = [path for path in artifacts if path.name.endswith(".whl")]
          sdists = [
              path
              for path in artifacts
              if path.name.endswith(".tar.gz") or path.name.endswith(".zip")
          ]
          if not wheels or not sdists:
              raise SystemExit("GitHub Release must include both wheel and sdist artifacts")
          for artifact in artifacts:
              actual = hashlib.sha256(artifact.read_bytes()).hexdigest()
              wanted = expected.get(artifact.name)
              if wanted is None:
                  raise SystemExit(f"SHA256SUMS is missing {artifact.name}")
              if wanted != actual:
                  raise SystemExit(f"SHA-256 mismatch for {artifact.name}")
          extra = sorted(set(expected) - {path.name for path in artifacts})
          if extra:
              raise SystemExit(f"SHA256SUMS lists missing artifacts: {', '.join(extra)}")
          print("verified", len(artifacts), "GitHub Release artifacts", file=sys.stderr)
          PY
      - name: Verify source/run-bound release provenance
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.release_tag }}
          VERIFIED_SOURCE_SHA: ${{ needs.verify_release_origin.outputs.source_sha }}
          VERIFIED_RELEASE_RUN_ID: ${{ needs.verify_release_origin.outputs.release_run_id }}
          WORKFLOW_RUN_STATUS: ${{ needs.verify_release_origin.outputs.workflow_run_status }}
          WORKFLOW_RUN_CONCLUSION: ${{ needs.verify_release_origin.outputs.workflow_run_conclusion }}
        run: |
          SOURCE_SHA="$(python -c 'import json; print(json.load(open("release-download/RELEASE-PROVENANCE.json", encoding="utf-8"))["source_sha"])')"
          SOURCE_TREE="$(python -c 'import json; print(json.load(open("release-download/RELEASE-PROVENANCE.json", encoding="utf-8"))["source_tree"])')"
          RELEASE_RUN_ID="$(python -c 'import json; print(json.load(open("release-download/RELEASE-PROVENANCE.json", encoding="utf-8"))["workflow"]["run_id"])')"
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${SOURCE_TREE}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${RELEASE_RUN_ID}" =~ ^[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${SOURCE_TREE}"
          test "${VERIFIED_SOURCE_SHA}" = "${SOURCE_SHA}"
          test "${VERIFIED_RELEASE_RUN_ID}" = "${RELEASE_RUN_ID}"
      - name: Stage validated distributions
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.release_tag }}
        run: |
          python .github/scripts/stage_release_assets.py \
            --source-dir release-download \
            --packages-dir release-staging/packages \
            --metadata-dir release-staging/metadata \
            --version "${RELEASE_TAG#v}"
      - name: Verify staged release provenance package set
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.release_tag }}
          WORKFLOW_RUN_STATUS: ${{ needs.verify_release_origin.outputs.workflow_run_status }}
          WORKFLOW_RUN_CONCLUSION: ${{ needs.verify_release_origin.outputs.workflow_run_conclusion }}
        run: |
          SOURCE_SHA="$(python -c 'import json; print(json.load(open("release-download/RELEASE-PROVENANCE.json", encoding="utf-8"))["source_sha"])')"
          SOURCE_TREE="$(python -c 'import json; print(json.load(open("release-download/RELEASE-PROVENANCE.json", encoding="utf-8"))["source_tree"])')"
          RELEASE_RUN_ID="$(python -c 'import json; print(json.load(open("release-download/RELEASE-PROVENANCE.json", encoding="utf-8"))["workflow"]["run_id"])')"
          python .github/scripts/release_provenance.py verify \
            --provenance release-download/RELEASE-PROVENANCE.json \
            --repository "${GITHUB_REPOSITORY}" \
            --source-sha "${SOURCE_SHA}" \
            --source-tree "${SOURCE_TREE}" \
            --release-tag "${RELEASE_TAG}" \
            --workflow-run-id "${RELEASE_RUN_ID}" \
            --workflow-run-status "${WORKFLOW_RUN_STATUS}" \
            --workflow-run-conclusion "${WORKFLOW_RUN_CONCLUSION}" \
            --packages-dir release-staging/packages
      - name: Refuse repeated PyPI publish
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.release_tag }}
        run: |
          version="${RELEASE_TAG#v}"
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/hermes-scope-recall/${version}/json")"
          if [ "${status}" = "200" ]; then
            echo "Refusing repeated PyPI publish for ${version}; package already exists." >&2
            exit 1
          fi
          if [ "${status}" != "404" ]; then
            echo "Unexpected PyPI status ${status} while checking ${version}" >&2
            exit 1
          fi
      - name: Validate staged distributions with Twine
        run: python -m twine check release-staging/packages/*
      - name: Upload reviewed release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scope-recall-pypi
          path: |
            release-staging/packages/*.whl
            release-staging/packages/*.tar.gz
            release-staging/metadata/SHA256SUMS
            release-staging/metadata/RELEASE-PROVENANCE.json
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download reviewed release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scope-recall-pypi
          path: release-assets
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release-assets/packages/
          print-hash: true
