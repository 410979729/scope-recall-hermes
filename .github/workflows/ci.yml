name: CI

on:
  push:
    # Branches must be explicit alongside the tag filter so main pushes
    # receive checks. Feature branches are covered by pull_request below.
    branches: [main]
    # Release tags refer to commits already checked on main; the release
    # gate consumes ci-required without repeating this workflow for tags.
    tags-ignore: ['**']
  pull_request:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    name: ${{ matrix.os }}-${{ matrix.tier }}
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Each layer runs its own tier: integration selects a shared
        # baseline and does not replace the layer-specific test sets.
        tier: [unit, contract, storage, capture, claims, deletion, episodes, retrieval, packaging, migration]
        # Host and native process checks run on Windows. Host includes
        # Task Scheduler paths; native requires LanceDB. Linux coverage
        # for these process tiers needs its own validation.
        include:
          - os: windows-latest
            tier: host
          - os: windows-latest
            tier: native
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        env:
          PIP_CONSTRAINT: constraints/release.txt
        run: python -m pip install ".[lancedb,codex,dev]" uv
      - name: Run tier (no implicit retries)
        run: python scripts/check.py --tier ${{ matrix.tier }} --task P17

  # The in-process tiers cover both ends of the supported Python range on
  # each platform to catch parser and standard-library differences. The
  # process tiers use the shared interpreter configured above.
  test-python-range:
    name: ${{ matrix.os }}-py${{ matrix.python }}
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies
        env:
          PIP_CONSTRAINT: constraints/release.txt
        run: python -m pip install ".[lancedb,codex,dev]" uv
      - name: Run the in-process tiers (no implicit retries)
        shell: bash
        run: |
          failed=""
          for tier in unit contract storage capture claims deletion episodes retrieval; do
            python scripts/check.py --tier "${tier}" --task P17 || failed="${failed} ${tier}"
          done
          test -z "${failed}" || { echo "failed tiers:${failed}"; exit 1; }

  # Formatting, lint and type findings, held to scripts/quality.baseline.json
  # (no file may gain findings of a rule, no function may grow past its size).  The environment comes from uv.lock, which
  # pins the ruff and pyright versions and the packages pyright reads, so a
  # contributor's `uv run python scripts/quality.py` sees what this sees.
  lint:
    name: lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install uv
      - name: Make the environment from the lock
        run: uv sync --locked --no-editable --extra lancedb --extra codex --extra dev --python 3.12
      - name: Check formatting, lint and types against the baseline
        run: uv run --no-sync python scripts/quality.py

  windows-daily:
    name: windows-${{ matrix.tier }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        tier: [integration, native]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Windows dependencies
        env:
          PIP_CONSTRAINT: constraints/release.txt
        run: python -m pip install ".[lancedb,codex,dev]" uv
      - name: Run Windows tier (no implicit retries)
        run: python scripts/check.py --tier ${{ matrix.tier }} --task P17

  ci-required:
    name: ci-required
    if: ${{ always() }}
    permissions: {}
    needs:
      - test
      - test-python-range
      - lint
      - windows-daily
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI dependency to succeed
        run: |
          test "${{ needs.test.result }}" = "${{ github.event_name == 'schedule' && 'skipped' || 'success' }}"
          test "${{ needs.test-python-range.result }}" = "${{ github.event_name == 'schedule' && 'skipped' || 'success' }}"
          test "${{ needs.lint.result }}" = "${{ github.event_name == 'schedule' && 'skipped' || 'success' }}"
          test "${{ needs.windows-daily.result }}" = "${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'success' || 'skipped' }}"
