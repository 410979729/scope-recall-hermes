name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Hermes Agent v0.19.1 / v2026.7.30. Compatibility upgrades are reviewed explicitly.
  HERMES_AGENT_COMMIT: cc4cab2f592e60a197e796506de9168f74baf3ea
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-py311
            os: ubuntu-latest
            python: "3.11"
            install-target: ".[lancedb,dev]"
            constraint: constraints/release.txt
            command: python -m pytest -q
          - name: linux-py312
            os: ubuntu-latest
            python: "3.12"
            install-target: ".[lancedb,dev]"
            constraint: constraints/release.txt
            command: python -m pytest -q
          - name: linux-dependency-min-py311
            os: ubuntu-latest
            python: "3.11"
            install-target: ".[lancedb,dev]"
            constraint: constraints/runtime-min.txt
            command: python -m pytest -q
          - name: linux-dependency-max-py312
            os: ubuntu-latest
            python: "3.12"
            install-target: ".[lancedb,dev]"
            constraint: constraints/runtime-max.txt
            command: python -m pytest -q
          - name: windows-full-py311
            os: windows-latest
            python: "3.11"
            install-target: ".[lancedb,dev]"
            constraint: constraints/release.txt
            command: python -m pytest -q
          - name: windows-full-py312
            os: windows-latest
            python: "3.12"
            install-target: ".[lancedb,dev]"
            constraint: constraints/release.txt
            command: python -m pytest -q
          - name: macos-full-py312
            os: macos-latest
            python: "3.12"
            install-target: ".[lancedb,dev]"
            constraint: constraints/release.txt
            command: python -m pytest -q

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Hermes runtime for plugin tests
        env:
          PIP_CONSTRAINT: ${{ matrix.constraint }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ matrix.install-target }}"
          python .github/scripts/checkout_pinned_hermes.py
          python -m pip install -e .hermes-agent-src
      - name: Run test suite
        env:
          PYTHONPATH: .hermes-agent-src
        run: ${{ matrix.command }}
      - name: Run Ruff
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: python -m ruff check .
      - name: Run Pyright
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: python -m pyright

  macos-lancedb-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install LanceDB runtime and pinned Hermes
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[lancedb,dev]"
          python .github/scripts/checkout_pinned_hermes.py
          python -m pip install -e .hermes-agent-src
      - name: Smoke native LanceDB path
        env:
          PYTHONPATH: .hermes-agent-src
        run: >-
          python -m pytest -q
          tests/test_hidden_vector_repair.py::test_hidden_vector_repair_handles_legacy_root_lancedb
          tests/test_tenth_review_regressions.py::test_lancedb_concurrent_handles_do_not_duplicate_ids

  windows-no-symlink:
    name: windows-no-symlink-py311
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and pinned Hermes runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[lancedb,dev]"
          python .github/scripts/checkout_pinned_hermes.py
          python -m pip install -e .hermes-agent-src
      - name: Exercise no-symlink Windows product paths
        shell: pwsh
        env:
          PYTHONPATH: .hermes-agent-src
          SCOPE_RECALL_TEST_FORCE_COPY_PLUGIN: "1"
          SCOPE_RECALL_TEST_ASSUME_NO_SYMLINK: "1"
        run: >-
          python -m pytest -q
          tests/test_initialize_peer_recovery.py
          tests/test_installer.py
          tests/test_windows_test_gate.py
          tests/test_windows_filesystem.py

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and pinned Hermes runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[lancedb,dev]"
          python .github/scripts/checkout_pinned_hermes.py
          python -m pip install -e .hermes-agent-src
      - name: Stress Desktop principal convergence
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          1..20 | ForEach-Object {
            python -m pytest -q -p no:cacheprovider tests/test_desktop_principal.py::test_concurrent_desktop_principal_first_create_converges
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Exercise Windows install and rollback paths
        shell: pwsh
        env:
          PYTHONPATH: .hermes-agent-src
        run: >-
          python -m pytest -q
          tests/test_installer.py::test_atomic_config_replace_keeps_original_on_replace_failure
          tests/test_installer.py::test_atomic_replace_treats_unsupported_parent_fsync_as_success_after_replace
          tests/test_installer.py::test_unconfirmed_activation_compensation_never_overwrites_post_snapshot_truth
          tests/test_installer.py::test_confirmed_activation_compensation_refuses_post_snapshot_truth_drift
          tests/test_maintenance_lease.py

  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[all,dev]"
          python .github/scripts/checkout_pinned_hermes.py
          python -m pip install -e .hermes-agent-src
      - name: Run release gate
        env:
          PYTHONPATH: .hermes-agent-src
        run: python scripts/check.release.py --development-snapshot

  ci-required:
    name: ci-required
    if: ${{ always() }}
    permissions: {}
    needs:
      - test
      - macos-lancedb-smoke
      - windows-no-symlink
      - windows-installer
      - release-gate
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI dependency to succeed
        run: |
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.macos-lancedb-smoke.result }}" = "success"
          test "${{ needs.windows-no-symlink.result }}" = "success"
          test "${{ needs.windows-installer.result }}" = "success"
          test "${{ needs.release-gate.result }}" = "success"
