name: CI

on:
  push:
    # With tags-ignore alone GitHub ran this workflow for no push at all: a
    # filter on one kind of ref leaves the other kind undefined, so a merge
    # to main went unchecked until the nightly run.  main is named here; a
    # pull request's branch is covered by pull_request below.
    branches: [main]
    # A tag push would start a second ci-required run on a commit main has
    # already checked.  The release gate reads the check name once however
    # many runs reported it, so that run would be harmless and is simply
    # not needed.
    tags-ignore: ['**']
  pull_request:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    name: ${{ matrix.os }}-${{ matrix.tier }}
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # storage, capture, claims, deletion, episodes and retrieval ran in
        # no workflow at all, and the nightly integration baseline does not
        # select their newest files (test_storage_growth.py,
        # test_vector_retention.py, test_aliases.py), so those tests had
        # only ever run on a developer's machine.
        tier: [unit, contract, storage, capture, claims, deletion, episodes, retrieval, packaging, migration]
        # host and native ran in no pull-request workflow at all. Both are
        # added here on Windows, where they are known to pass; native is gated
        # on LanceDB rather than on Windows and host holds the only
        # Task Scheduler paths, so moving either to Linux is its own change.
        include:
          - os: windows-latest
            tier: host
          - os: windows-latest
            tier: native
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        env:
          PIP_CONSTRAINT: constraints/release.txt
        run: python -m pip install ".[lancedb,codex,dev]" uv
      - name: Run tier (no implicit retries)
        run: python scripts/check.py --tier ${{ matrix.tier }} --task P17

  # requires-python admits 3.11 to 3.14, yet every job above is 3.12: a
  # construct only 3.12 parses would pass there and fail at import on 3.11,
  # and a standard-library change would pass there and fail on 3.14 (on
  # Windows 3.13 added os.fchmod, which the vector store then called and
  # was refused).  Hermes Desktop builds its plugin environment on 3.14
  # (#135).  One job per system and end of the range runs the in-process
  # tiers; the process tiers stay on 3.12 above.
  test-python-range:
    name: ${{ matrix.os }}-py${{ matrix.python }}
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies
        env:
          PIP_CONSTRAINT: constraints/release.txt
        run: python -m pip install ".[lancedb,codex,dev]" uv
      - name: Run the in-process tiers (no implicit retries)
        shell: bash
        run: |
          failed=""
          for tier in unit contract storage capture claims deletion episodes retrieval; do
            python scripts/check.py --tier "${tier}" --task P17 || failed="${failed} ${tier}"
          done
          test -z "${failed}" || { echo "failed tiers:${failed}"; exit 1; }

  # Formatting, lint and type findings, held to scripts/quality.baseline.json
  # (no file may gain findings of a rule, no function may grow past its size).  The environment comes from uv.lock, which
  # pins the ruff and pyright versions and the packages pyright reads, so a
  # contributor's `uv run python scripts/quality.py` sees what this sees.
  lint:
    name: lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install uv
      - name: Make the environment from the lock
        run: uv sync --locked --no-editable --extra lancedb --extra codex --extra dev --python 3.12
      - name: Check formatting, lint and types against the baseline
        run: uv run --no-sync python scripts/quality.py

  windows-daily:
    name: windows-${{ matrix.tier }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        tier: [integration, native]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Windows dependencies
        env:
          PIP_CONSTRAINT: constraints/release.txt
        run: python -m pip install ".[lancedb,codex,dev]" uv
      - name: Run Windows tier (no implicit retries)
        run: python scripts/check.py --tier ${{ matrix.tier }} --task P17

  ci-required:
    name: ci-required
    if: ${{ always() }}
    permissions: {}
    needs:
      - test
      - test-python-range
      - lint
      - windows-daily
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI dependency to succeed
        run: |
          test "${{ needs.test.result }}" = "${{ github.event_name == 'schedule' && 'skipped' || 'success' }}"
          test "${{ needs.test-python-range.result }}" = "${{ github.event_name == 'schedule' && 'skipped' || 'success' }}"
          test "${{ needs.lint.result }}" = "${{ github.event_name == 'schedule' && 'skipped' || 'success' }}"
          test "${{ needs.windows-daily.result }}" = "${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'success' || 'skipped' }}"
