name: CI

on:
  push:
    # A tag push would start a second ci-required run on the same commit,
    # and the release gate compares the successful check names as one
    # string: two successes read as neither.
    tags-ignore: ['**']
  pull_request:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      model_evidence_tag:
        description: "Optional existing evidence release tag for the release gate"
        required: false
        type: string

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    name: ${{ matrix.os }}-${{ matrix.tier }}
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        tier: [unit, contract, packaging]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        env:
          PIP_CONSTRAINT: constraints/release.txt
        run: python -m pip install ".[lancedb,codex,dev]" uv
      - name: Run tier (no implicit retries)
        run: python scripts/check.py --tier ${{ matrix.tier }} --task P17

  windows-daily:
    name: windows-${{ matrix.tier }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        tier: [integration, native]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Windows dependencies
        env:
          PIP_CONSTRAINT: constraints/release.txt
        run: python -m pip install ".[lancedb,codex,dev]" uv
      - name: Run Windows tier (no implicit retries)
        run: python scripts/check.py --tier ${{ matrix.tier }} --task P17

  release-gate:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.model_evidence_tag != '' || vars.SCOPE_RECALL_MODEL_EVIDENCE_TAG != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[lancedb,codex,dev]"
      - name: Download and verify model evidence bundle
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_EVIDENCE_TAG: ${{ inputs.model_evidence_tag || vars.SCOPE_RECALL_MODEL_EVIDENCE_TAG }}
        run: |
          set -euo pipefail
          test -n "${MODEL_EVIDENCE_TAG}"
          SOURCE_SHA="$(git rev-parse HEAD)"
          ARCHIVE_NAME="scope-recall-model-evidence-${SOURCE_SHA}.zip"
          rm -rf .execution/model-evidence
          mkdir -p .execution/model-evidence/incoming
          gh release download "${MODEL_EVIDENCE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${ARCHIVE_NAME}" \
            --dir .execution/model-evidence/incoming
          test "$(find .execution/model-evidence/incoming -maxdepth 1 -type f -name "${ARCHIVE_NAME}" | wc -l)" -eq 1
          python scripts/extract_model_evidence.py \
            --archive ".execution/model-evidence/incoming/${ARCHIVE_NAME}" \
            --bundle .execution/model-evidence/bundle \
            --source-sha "${SOURCE_SHA}"
          python scripts/check.py --tier release --task P17 --model-receipt ".execution/model-evidence/bundle/formal-receipt.json"

  ci-required:
    name: ci-required
    if: ${{ always() }}
    permissions: {}
    needs:
      - test
      - windows-daily
      - release-gate
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI dependency to succeed
        run: |
          test "${{ needs.test.result }}" = "${{ github.event_name == 'schedule' && 'skipped' || 'success' }}"
          test "${{ needs.windows-daily.result }}" = "${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'success' || 'skipped' }}"
          test "${{ needs.release-gate.result }}" = "success" || test "${{ needs.release-gate.result }}" = "skipped"
