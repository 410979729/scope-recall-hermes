name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      model_evidence_tag:
        description: "Optional existing evidence release tag for the release gate"
        required: false
        type: string

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-py311
            os: ubuntu-latest
            python: "3.11"
            install-target: ".[lancedb,codex,dev]"
            constraint: constraints/release.txt
            command: python scripts/check.py --tier integration --task P17
          - name: linux-py312
            os: ubuntu-latest
            python: "3.12"
            install-target: ".[lancedb,codex,dev]"
            constraint: constraints/release.txt
            command: python scripts/check.py --tier integration --task P17
          - name: linux-dependency-min-py311
            os: ubuntu-latest
            python: "3.11"
            install-target: ".[lancedb,codex,dev]"
            constraint: constraints/runtime-min.txt
            command: python scripts/check.py --tier integration --task P17
          - name: linux-dependency-max-py312
            os: ubuntu-latest
            python: "3.12"
            install-target: ".[lancedb,codex,dev]"
            constraint: constraints/runtime-max.txt
            command: python scripts/check.py --tier integration --task P17
          - name: windows-full-py311
            os: windows-latest
            python: "3.11"
            install-target: ".[lancedb,codex,dev]"
            constraint: constraints/release.txt
            command: python scripts/check.py --tier integration --task P17
          - name: windows-full-py312
            os: windows-latest
            python: "3.12"
            install-target: ".[lancedb,codex,dev]"
            constraint: constraints/release.txt
            command: python scripts/check.py --tier integration --task P17
          - name: macos-full-py312
            os: macos-latest
            python: "3.12"
            install-target: ".[lancedb,codex,dev]"
            constraint: constraints/release.txt
            command: python scripts/check.py --tier integration --task P17

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install current v3 test dependencies
        env:
          PIP_CONSTRAINT: ${{ matrix.constraint }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ matrix.install-target }}"
      - name: Run test suite
        run: ${{ matrix.command }}
      - name: Run v3 allowlist Ruff
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: python scripts/v3_lint.py --tool ruff
      - name: Run v3 allowlist Pyright
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: python scripts/v3_lint.py --tool pyright

  release-gate:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.model_evidence_tag != '' || vars.SCOPE_RECALL_MODEL_EVIDENCE_TAG != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[lancedb,codex,dev]"
      - name: Download and verify model evidence bundle
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_EVIDENCE_TAG: ${{ inputs.model_evidence_tag || vars.SCOPE_RECALL_MODEL_EVIDENCE_TAG }}
        run: |
          set -euo pipefail
          test -n "${MODEL_EVIDENCE_TAG}"
          SOURCE_SHA="$(git rev-parse HEAD)"
          ARCHIVE_NAME="scope-recall-model-evidence-${SOURCE_SHA}.zip"
          rm -rf .execution/model-evidence
          mkdir -p .execution/model-evidence/incoming
          gh release download "${MODEL_EVIDENCE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${ARCHIVE_NAME}" \
            --dir .execution/model-evidence/incoming
          test "$(find .execution/model-evidence/incoming -maxdepth 1 -type f -name "${ARCHIVE_NAME}" | wc -l)" -eq 1
          python scripts/extract_model_evidence.py \
            --archive ".execution/model-evidence/incoming/${ARCHIVE_NAME}" \
            --bundle .execution/model-evidence/bundle \
            --source-sha "${SOURCE_SHA}"
          python scripts/check.py --tier release --task P17 --model-receipt ".execution/model-evidence/bundle/formal-receipt.json"

  ci-required:
    name: ci-required
    if: ${{ always() }}
    permissions: {}
    needs:
      - test
      - release-gate
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI dependency to succeed
        run: |
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.release-gate.result }}" = "success" || test "${{ needs.release-gate.result }}" = "skipped"
